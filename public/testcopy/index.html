<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Restaurant</title>
<link rel="icon" href="data:,">
</head>
<body>
<div id="app">
  <header id="site-header">
    <div class="brand">
      <img id="site-logo" alt="" hidden>
      <div>
        <h1 id="site-name">Loading…</h1>
        <p id="site-about"></p>
      </div>
    </div>
    <nav id="tabs" role="tablist">
      <button data-view="menu" class="active">Menu</button>
      <button data-view="order">My Order <span id="cart-count" class="badge" hidden></span></button>
      <button data-view="kitchen">Kitchen <span id="kitchen-count" class="badge" hidden></span></button>
      <button data-view="receipt">Receipt</button>
      <button data-view="setup">Setup</button>
    </nav>
  </header>
  <main>
    <section id="view-menu" class="view"></section>
    <section id="view-order" class="view" hidden></section>
    <section id="view-kitchen" class="view" hidden></section>
    <section id="view-receipt" class="view" hidden></section>
    <section id="view-setup" class="view" hidden></section>
  </main>
  <footer id="site-footer"></footer>
  <div id="print-area"></div>
</div>
<script>
  /* Bootstrap: work out this folder's own address from the URL itself, so a
     copied folder just works under its new name. No folder name is written
     anywhere in this page's code. */
  (function () {
    var p = location.pathname;
    var last = p.split('/').pop();
    var base = last.indexOf('.') !== -1
      ? p.replace(/\/[^\/]*$/, '/')
      : (p.charAt(p.length - 1) === '/' ? p : p + '/');
    window.RMS_BASE = base;
    var link = document.createElement('link');
    link.rel = 'stylesheet';
    link.href = base + 'style.css';
    document.head.appendChild(link);
    var script = document.createElement('script');
    script.src = base + 'app.js';
    document.body.appendChild(script);
  })();
</script>
</body>
</html>
