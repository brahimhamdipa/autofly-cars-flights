<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Barbershop</title>
<link rel="stylesheet" href="style.css">
<script>
  // The page derives its own address from the URL, so a copy of this
  // folder under a new name just works: the address changes by itself.
  // No folder name is hardcoded here.
  (function () {
    var path = window.location.pathname.replace(/\/+$/, '');
    var slug = path.substring(path.lastIndexOf('/') + 1) || 'barbershop';
    var base = window.location.pathname;
    if (!/\/$/.test(base)) base += '/';
    window.RMS_SLUG = slug;
    window.RMS_BASE = base;
  })();
</script>
</head>
<body>
<header class="top">
  <h1 id="biz-name">Barbershop</h1>
  <p id="biz-about" class="about"></p>
  <div id="biz-meta" class="meta"></div>
</header>

<nav class="tabs" id="tabs">
  <button data-tab="services" class="active">Services</button>
  <button data-tab="book">Book</button>
  <button data-tab="bookings">Bookings</button>
  <button data-tab="setup">Setup</button>
</nav>

<main>
  <section id="view-services" class="view"></section>
  <section id="view-book" class="view" hidden></section>
  <section id="view-bookings" class="view" hidden></section>
  <section id="view-setup" class="view" hidden></section>
</main>

<footer class="foot">
  <a href="#" id="back-link">← Back</a>
  <span class="hint">Demo template — the owner edits everything in Setup.</span>
</footer>

<script src="app.js"></script>
</body>
</html>
